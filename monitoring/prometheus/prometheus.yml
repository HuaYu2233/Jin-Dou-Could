global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  - job_name: cloud-drive-backend
    metrics_path: /metrics
    static_configs:
      - targets:
          - backend:8000
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: backend

  - job_name: cloud-drive-redis
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: cloud-drive-postgres
    static_configs:
      - targets:
          - postgres-exporter:9187

  - job_name: cloud-drive-minio
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    static_configs:
      - targets:
          - minio:9000
