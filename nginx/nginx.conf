worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 10G;

    # ==================== 临时文件路径 ====================
    proxy_temp_path /var/cache/nginx/proxy_temp;

    # ==================== Gzip 压缩 ====================
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 500;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        font/opentype
        font/ttf
        font/woff
        font/woff2;

    # ==================== 代理缓存配置 ====================
    proxy_cache_path /var/cache/nginx/minio
        levels=1:2
        keys_zone=minio_cache:50m
        max_size=2g
        inactive=60m
        use_temp_path=off;

    proxy_cache_path /var/cache/nginx/thumbnails
        levels=1:2
        keys_zone=thumbnail_cache:20m
        max_size=500m
        inactive=120m
        use_temp_path=off;

    upstream frontend_upstream {
        server frontend:3000;
    }

    upstream backend_upstream {
        server backend:8000;
    }

    upstream minio_upstream {
        server minio:9000;
    }

    # ==================== 限流配置 ====================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=download_limit:10m rate=30r/m;

    server {
        listen 80;
        server_name localhost;

        # 安全响应头
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ==================== Next.js 静态资源（长期缓存）====================
        location /_next/static/ {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            add_header Cache-Control "public, max-age=31536000, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        # ==================== MinIO 缩略图代理（带缓存）====================
        location /thumbnails/ {
            proxy_pass http://minio_upstream/cloud-drive/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_cache thumbnail_cache;
            proxy_cache_valid 200 120m;
            proxy_cache_valid 404 1m;
            proxy_cache_key $uri;
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status;
            add_header Cache-Control "public, max-age=7200";
            add_header X-Content-Type-Options "nosniff" always;

            expires 2h;
        }

        # ==================== MinIO 公开下载代理（带缓存）====================
        location /storage/ {
            proxy_pass http://minio_upstream/cloud-drive/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_cache minio_cache;
            proxy_cache_valid 200 60m;
            proxy_cache_valid 206 60m;
            proxy_cache_valid 404 1m;
            proxy_cache_key $uri$slice_range;
            proxy_cache_use_stale error timeout updating;
            add_header X-Cache-Status $upstream_cache_status;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Accept-Ranges bytes;

            limit_req zone=download_limit burst=10 nodelay;

            expires 1h;
        }

        # ==================== API 请求转发到 FastAPI 后端 ====================
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_request_buffering off;

            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # ==================== WebSocket 转发到 FastAPI 后端 ====================
        location /api/v1/ws/ {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ==================== 其他请求转发到 Next.js 前端 ====================
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

