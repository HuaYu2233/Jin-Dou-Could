services:
  # ==================== PostgreSQL ====================
  db:
    image: postgres:15-alpine
    container_name: cloud-drive-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clouduser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudpass123}
      POSTGRES_DB: ${POSTGRES_DB:-clouddrive}
    command: postgres -c max_connections=${DB_MAX_CONNECTIONS:-100}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: cloud-drive-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redispass123} --rename-command FLUSHALL ""
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redispass123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== MinIO (对象存储) ====================
  minio:
    image: minio/minio:latest
    container_name: cloud-drive-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # Web Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ==================== PgBouncer 连接池代理 ====================
  pgbouncer:
    image: edoburu/pgbouncer:1.21.0-p2
    container_name: cloud-drive-pgbouncer
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-clouduser}:${POSTGRES_PASSWORD:-cloudpass123}@db:5432/${POSTGRES_DB:-clouddrive}
      - LISTEN_PORT=5432
      - AUTH_TYPE=scram-sha-256
      - PGBOUNCER_POOL_MODE=transaction
      - PGBOUNCER_MAX_CLIENT_CONN=200
      - PGBOUNCER_DEFAULT_POOL_SIZE=20
      - PGBOUNCER_MIN_POOL_SIZE=5
      - PGBOUNCER_RESERVE_POOL_SIZE=5
      - PGBOUNCER_RESERVE_POOL_TIMEOUT=3
      - PGBOUNCER_SERVER_IDLE_TIMEOUT=300
      - PGBOUNCER_SERVER_LIFETIME=3600
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgbouncer -u pgbouncer -q /etc/pgbouncer/pgbouncer.ini -R || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== FastAPI 后端 ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloud-drive-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "localhost:host-gateway"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-clouduser}:${POSTGRES_PASSWORD:-cloudpass123}@db:5432/${POSTGRES_DB:-clouddrive}
      - DATABASE_URL_DIRECT=postgresql+asyncpg://${POSTGRES_USER:-clouduser}:${POSTGRES_PASSWORD:-cloudpass123}@db:5432/${POSTGRES_DB:-clouddrive}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redispass123}@redis:6379/0
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BUCKET=${MINIO_BUCKET:-cloud-drive}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - MINIO_DOWNLOAD_EXPIRES=${MINIO_DOWNLOAD_EXPIRES:-3600}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY 必须在 .env 中设置}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - BACKEND_WORKERS=${BACKEND_WORKERS:-4}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-5}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-5}
      - DB_POOL_TIMEOUT=${DB_POOL_TIMEOUT:-30}
      - DB_POOL_RECYCLE=${DB_POOL_RECYCLE:-3600}
      - HTTPS_REDIRECT=${HTTPS_REDIRECT:-false}
      - SECURITY_HEADERS_ENABLED=${SECURITY_HEADERS_ENABLED:-true}
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-104857600}
      - UPLOAD_CHUNK_SIZE=${UPLOAD_CHUNK_SIZE:-8388608}
      - MULTIPART_THRESHOLD=${MULTIPART_THRESHOLD:-16777216}
      - UPLOAD_PART_SIZE=${UPLOAD_PART_SIZE:-5242880}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - MAX_USERS=${MAX_USERS:-0}
      - DEFAULT_STORAGE_QUOTA=${DEFAULT_STORAGE_QUOTA:-1073741824}
      - RATE_LIMIT_ENABLED=${RATE_LIMIT_ENABLED:-true}
      - RATE_LIMIT_PER_MINUTE=${RATE_LIMIT_PER_MINUTE:-60}
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      - LOGIN_RATE_LIMIT_MAX_ATTEMPTS=${LOGIN_RATE_LIMIT_MAX_ATTEMPTS:-5}
      - LOGIN_RATE_LIMIT_WINDOW_SECONDS=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:-300}
      - LOGIN_RATE_LIMIT_LOCK_SECONDS=${LOGIN_RATE_LIMIT_LOCK_SECONDS:-900}
      - MAX_CONCURRENT_UPLOADS=${MAX_CONCURRENT_UPLOADS:-3}
      - MAX_CONCURRENT_DOWNLOADS=${MAX_CONCURRENT_DOWNLOADS:-5}
      - CSRF_ENABLED=${CSRF_ENABLED:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=${LOG_DIR:-logs}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-30}
      - ALERT_ENABLED=${ALERT_ENABLED:-false}
      - ALERT_MIN_LEVEL=${ALERT_MIN_LEVEL:-ERROR}
      - ALERT_COOLDOWN_SECONDS=${ALERT_COOLDOWN_SECONDS:-300}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_WEBHOOK_TYPE=${ALERT_WEBHOOK_TYPE:-generic}
      - ALERT_EMAIL_ENABLED=${ALERT_EMAIL_ENABLED:-false}
      - ALERT_EMAIL_SMTP_HOST=${ALERT_EMAIL_SMTP_HOST:-}
      - ALERT_EMAIL_SMTP_PORT=${ALERT_EMAIL_SMTP_PORT:-587}
      - ALERT_EMAIL_SMTP_USER=${ALERT_EMAIL_SMTP_USER:-}
      - ALERT_EMAIL_SMTP_PASSWORD=${ALERT_EMAIL_SMTP_PASSWORD:-}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - ALERT_EMAIL_USE_TLS=${ALERT_EMAIL_USE_TLS:-true}
      - RESET_PASSWORD_CODE_EXPIRE_SECONDS=${RESET_PASSWORD_CODE_EXPIRE_SECONDS:-600}
      - RESET_PASSWORD_CODE_LENGTH=${RESET_PASSWORD_CODE_LENGTH:-6}
      - BACKUP_DIR=/backups
      - BACKUP_TRIGGER_CMD=${BACKUP_TRIGGER_CMD:-}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-}
      - CELERY_RESULT_BACKEND_URL=${CELERY_RESULT_BACKEND_URL:-}
      - CELERY_TASK_ALWAYS_EAGER=${CELERY_TASK_ALWAYS_EAGER:-false}
      - WS_PUBSUB_ENABLED=${WS_PUBSUB_ENABLED:-true}
      - PROMETHEUS_ENABLED=${PROMETHEUS_ENABLED:-false}
      - METRICS_TOKEN=${METRICS_TOKEN:-}
      - ALGORITHM=${ALGORITHM:-HS256}
      - JWT_PRIVATE_KEY_PATH=${JWT_PRIVATE_KEY_PATH:-}
      - JWT_PUBLIC_KEY_PATH=${JWT_PUBLIC_KEY_PATH:-}
    volumes:
      - ./backups:/backups
      - jwt_keys:/run/secrets:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      sh -c "DATABASE_URL=$${DATABASE_URL_DIRECT} alembic upgrade head && exec gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w ${BACKEND_WORKERS:-4} --bind 0.0.0.0:8000 --timeout 120 --graceful-timeout 30"

  # ==================== Celery Worker ====================
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: cloud-drive-celery-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-clouduser}:${POSTGRES_PASSWORD:-cloudpass123}@db:5432/${POSTGRES_DB:-clouddrive}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redispass123}@redis:6379/0
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-minio:9000}
      - MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BUCKET=${MINIO_BUCKET:-cloud-drive}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY 必须在 .env 中设置}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - BACKUP_DIR=/backups
      - BACKUP_TRIGGER_CMD=${BACKUP_TRIGGER_CMD:-}
      - CELERY_BROKER_URL=${CELERY_BROKER_URL:-}
      - CELERY_RESULT_BACKEND_URL=${CELERY_RESULT_BACKEND_URL:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=${LOG_DIR:-logs}
      - ALERT_ENABLED=${ALERT_ENABLED:-false}
      - ALERT_MIN_LEVEL=${ALERT_MIN_LEVEL:-ERROR}
      - ALERT_COOLDOWN_SECONDS=${ALERT_COOLDOWN_SECONDS:-300}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_WEBHOOK_TYPE=${ALERT_WEBHOOK_TYPE:-generic}
      - ALERT_EMAIL_ENABLED=${ALERT_EMAIL_ENABLED:-false}
      - ALERT_EMAIL_SMTP_HOST=${ALERT_EMAIL_SMTP_HOST:-}
      - ALERT_EMAIL_SMTP_PORT=${ALERT_EMAIL_SMTP_PORT:-587}
      - ALERT_EMAIL_SMTP_USER=${ALERT_EMAIL_SMTP_USER:-}
      - ALERT_EMAIL_SMTP_PASSWORD=${ALERT_EMAIL_SMTP_PASSWORD:-}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - ALERT_EMAIL_USE_TLS=${ALERT_EMAIL_USE_TLS:-true}
      - RESET_PASSWORD_SMTP_HOST=${RESET_PASSWORD_SMTP_HOST:-}
      - RESET_PASSWORD_SMTP_PORT=${RESET_PASSWORD_SMTP_PORT:-465}
      - RESET_PASSWORD_SMTP_USER=${RESET_PASSWORD_SMTP_USER:-}
      - RESET_PASSWORD_SMTP_PASSWORD=${RESET_PASSWORD_SMTP_PASSWORD:-}
      - RESET_PASSWORD_FROM_EMAIL=${RESET_PASSWORD_FROM_EMAIL:-}
      - RESET_PASSWORD_FROM_NAME=${RESET_PASSWORD_FROM_NAME:-筋斗云盘}
      - RESET_PASSWORD_CODE_EXPIRE_SECONDS=${RESET_PASSWORD_CODE_EXPIRE_SECONDS:-600}
      - RESET_PASSWORD_CODE_LENGTH=${RESET_PASSWORD_CODE_LENGTH:-6}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: >
      celery -A app.core.celery_app:celery_app worker --loglevel=${LOG_LEVEL:-INFO} --concurrency=${CELERY_CONCURRENCY:-4} --without-heartbeat

  # ==================== Next.js 前端 ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
    container_name: cloud-drive-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - API_URL=${API_URL:-http://backend:8000}
      - PORT=3000
      - HOSTNAME=0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ==================== 备份服务 ====================
  backup:
    build:
      context: ./scripts
      dockerfile: Dockerfile.backup
    container_name: cloud-drive-backup
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER:-clouduser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cloudpass123}
      - POSTGRES_DB=${POSTGRES_DB:-clouddrive}
      - MINIO_HOST=minio
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BUCKET=cloud-drive
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      - BACKUP_CRON=${BACKUP_CRON:-0 3 * * *}
      - RUN_ON_START=${BACKUP_RUN_ON_START:-false}
      - BACKUP_ENCRYPT_KEY=${BACKUP_ENCRYPT_KEY:-}
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
      - backup_logs:/var/log
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  # ==================== Nginx 反向代理 (可选) ====================
  nginx:
    image: nginx:alpine
    container_name: cloud-drive-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
    depends_on:
      - frontend
      - backend
      - minio

  # ==================== Prometheus ====================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: cloud-drive-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - backend

  # ==================== Grafana ====================
  grafana:
    image: grafana/grafana:11.4.0
    container_name: cloud-drive-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # ==================== Redis Exporter ====================
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: cloud-drive-redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redispass123}
    ports:
      - "127.0.0.1:9121:9121"
    depends_on:
      - redis

  # ==================== PostgreSQL Exporter ====================
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.16.0
    container_name: cloud-drive-postgres-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-clouduser}:${POSTGRES_PASSWORD:-cloudpass123}@db:5432/${POSTGRES_DB:-clouddrive}?sslmode=disable
    ports:
      - "127.0.0.1:9187:9187"
    depends_on:
      - db

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backup_logs:
  nginx_cache:
  prometheus_data:
  grafana_data:
  jwt_keys:
  frontend_node_modules:
  frontend_next_cache: