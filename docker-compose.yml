version: "3.9"

services:
  # ==================== PostgreSQL ====================
  db:
    image: postgres:15-alpine
    container_name: cloud-drive-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clouduser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloudpass123}
      POSTGRES_DB: ${POSTGRES_DB:-clouddrive}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== Redis ====================
  redis:
    image: redis:7-alpine
    container_name: cloud-drive-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== MinIO (对象存储) ====================
  minio:
    image: minio/minio:latest
    container_name: cloud-drive-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ==================== FastAPI 后端 ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloud-drive-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-clouduser}:${POSTGRES_PASSWORD:-cloudpass123}@db:5432/${POSTGRES_DB:-clouddrive}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=localhost:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BUCKET=cloud-drive
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY 必须在 .env 中设置}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - MAX_UPLOAD_SIZE=${MAX_UPLOAD_SIZE:-104857600}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      - REFRESH_TOKEN_EXPIRE_DAYS=${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - MAX_USERS=${MAX_USERS:-0}
      - DEFAULT_STORAGE_QUOTA=${DEFAULT_STORAGE_QUOTA:-1073741824}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_DIR=${LOG_DIR:-logs}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS:-30}
      - ALERT_ENABLED=${ALERT_ENABLED:-false}
      - ALERT_MIN_LEVEL=${ALERT_MIN_LEVEL:-ERROR}
      - ALERT_COOLDOWN_SECONDS=${ALERT_COOLDOWN_SECONDS:-300}
      - ALERT_WEBHOOK_URL=${ALERT_WEBHOOK_URL:-}
      - ALERT_WEBHOOK_TYPE=${ALERT_WEBHOOK_TYPE:-generic}
      - ALERT_EMAIL_ENABLED=${ALERT_EMAIL_ENABLED:-false}
      - ALERT_EMAIL_SMTP_HOST=${ALERT_EMAIL_SMTP_HOST:-}
      - ALERT_EMAIL_SMTP_PORT=${ALERT_EMAIL_SMTP_PORT:-587}
      - ALERT_EMAIL_SMTP_USER=${ALERT_EMAIL_SMTP_USER:-}
      - ALERT_EMAIL_SMTP_PASSWORD=${ALERT_EMAIL_SMTP_PASSWORD:-}
      - ALERT_EMAIL_FROM=${ALERT_EMAIL_FROM:-}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - ALERT_EMAIL_USE_TLS=${ALERT_EMAIL_USE_TLS:-true}
      - BACKUP_DIR=/backups
      - BACKUP_TRIGGER_CMD=${BACKUP_TRIGGER_CMD:-docker exec cloud-drive-backup /scripts/backup.sh}
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - ./backups:/backups
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      # redis:
      #   condition: service_healthy
      # minio:
      #   condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # ==================== Next.js 前端 ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloud-drive-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - API_URL=http://backend:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ==================== 备份服务 ====================
  backup:
    build:
      context: ./scripts
      dockerfile: Dockerfile.backup
    container_name: cloud-drive-backup
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_USER=${POSTGRES_USER:-clouduser}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-cloudpass123}
      - POSTGRES_DB=${POSTGRES_DB:-clouddrive}
      - MINIO_HOST=minio
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - MINIO_BUCKET=cloud-drive
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-7}
      - BACKUP_CRON=${BACKUP_CRON:-0 3 * * *}
      - RUN_ON_START=${BACKUP_RUN_ON_START:-false}
      - BACKUP_ENCRYPT_KEY=${BACKUP_ENCRYPT_KEY:-}
    volumes:
      - ./scripts:/scripts:ro
      - ./backups:/backups
      - backup_logs:/var/log
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started

  # ==================== Nginx 反向代理 (可选) ====================
  nginx:
    image: nginx:alpine
    container_name: cloud-drive-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  backup_logs: