[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "huayu", email = "1343367056@qq.com" }
]
requires-python = ">=3.9"
dependencies = [
    "alembic>=1.16.5",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.128.8",
    "bcrypt==4.2.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.2.1",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn>=0.39.0",
    "gunicorn>=22.0.0",
    "python-magic>=0.4.27",
    "minio>=7.2.7",
    "aiobotocore>=2.15.0",
    "redis>=5.0.7",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.9",
    "loguru>=0.7.2",
    "celery>=5.4.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
]

[tool.uv]
package = false

[project.optional-dependencies]
dev = [
    "ruff>=0.11.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]
allowed-confusables = ["，", "（", "）", "：", "？", "！"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
    "fastapi.Security",
    "fastapi.params.Depends",
    "fastapi.params.Query",
    "fastapi.params.Path",
    "fastapi.params.Body",
    "fastapi.params.Header",
    "fastapi.params.Cookie",
    "fastapi.params.Form",
    "fastapi.params.File",
    "fastapi.params.Security",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]